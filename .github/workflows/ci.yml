name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os:
          - "ubuntu-latest"
          - "windows-latest"
    runs-on: "${{ matrix.os }}"
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install uv
        uses: astral-sh/setup-uv@e58605a9b6da7c637471fab8847a5e5a6b8df081 # v5
        with:
          version: "0.12.1"
      - name: Install Python
        run: uv python install 3.12
      - name: Install dependencies
        run: uv sync --locked --group dev --no-install-project
      - name: Validate lockfile
        run: uv lock --check
      - name: Audit locked dependencies
        run: uv audit --locked --preview-features audit-command
      - name: Check formatting
        run: uv run --no-sync ruff format --check src tests scripts
      - name: Lint
        run: |
          uv run --no-sync ruff check src tests scripts
          uv run --no-sync ruff check src scripts --select S
      - name: Test
        run: |
          uv run --no-sync coverage run -m pytest -q
          uv run --no-sync coverage report
          uv run --no-sync coverage json -o coverage-report.json
          uv run --no-sync python scripts/check_coverage.py coverage-report.json
      - name: Build package
        run: |
          uv build --build-constraint build-constraints.txt --require-hashes
          uv run --no-sync python scripts/verify_distribution.py
      - name: Retain verified distributions
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: "lookingglass-distributions-${{ github.sha }}-${{ matrix.os }}"
          path: dist/*
          if-no-files-found: error
          retention-days: 14
