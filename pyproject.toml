[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "async-api-view"
version = "0.1.0"
description = "Local canonical state and refresh service for remote systems"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115,<1",
    "jinja2>=3.1,<4",
    "uvicorn>=0.30,<1",
]

[project.scripts]
async-api-view = "async_api_view.cli:main"

[dependency-groups]
dev = [
    "httpx2>=2.12,<3",
    "pytest>=8.3,<9",
    "ruff>=0.9,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/async_api_view"]

[tool.pytest.ini_options]
addopts = "-ra"
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
